# Releases. Push a tag vX.Y.Z and GitHub tests, builds both platforms and publishes a release with:
#   MacroPad-win-x64.exe              single file; the Windows app updates itself from this
#   MacroPad-linux-x64                single file; a portable Linux copy updates itself from this
#   MacroPad-X.Y.Z-linux-x64.tar.gz   the binary plus desktop entry, icon, udev rule; the AUR package installs this
#   SHA256SUMS.txt
# Then the AUR package macropad-bin is updated, when the secret AUR_SSH_PRIVATE_KEY is set (packaging/aur/README.md).
# Run it by hand (Actions → Release) to redo a tag that already exists, for example after adding the AUR key.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds on Windows: only there can the SDK put the icon and version into the .exe.
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test
      - name: Publish
        shell: bash
        run: |
          version="${TAG#v}"
          dotnet publish src/MacroPad.App -c Release -r ${{ matrix.rid }} -p:Version="$version" -o out
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: out/MacroPad*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble
        run: |
          version="${TAG#v}"
          mkdir dist
          cp artifacts/win-x64/MacroPad.exe dist/MacroPad-win-x64.exe
          cp artifacts/linux-x64/MacroPad dist/MacroPad-linux-x64
          chmod +x dist/MacroPad-linux-x64
          pkg="MacroPad-${version}-linux-x64"
          mkdir "$pkg"
          cp dist/MacroPad-linux-x64 "$pkg/MacroPad"
          cp packaging/linux/{70-macropad.rules,macropad.desktop,macropad.png} LICENSE.md README.md "$pkg/"
          tar czf "dist/$pkg.tar.gz" "$pkg"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "MacroPad ${TAG#v}" --generate-notes
          fi

  aur:
    name: Update the AUR package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for the AUR key
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::warning::AUR_SSH_PRIVATE_KEY is not set, so the AUR package was not updated"; fi
      - uses: actions/checkout@v7
        if: steps.aur.outputs.ready == 'true'
        with:
          ref: ${{ env.TAG }}
      - name: Set the version
        if: steps.aur.outputs.ready == 'true'
        run: sed -i -e "s/^pkgver=.*/pkgver=${TAG#v}/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      # Downloads the new archive for the checksum, writes .SRCINFO and pushes.
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        if: steps.aur.outputs.ready == 'true'
        with:
          pkgname: macropad-bin
          pkgbuild: packaging/aur/PKGBUILD
          # The .gitignore keeps the release tarball that updpkgsums downloads out of the AUR repository, which
          # refuses files over about 488 KB.
          assets: |
            packaging/aur/macropad-bin.install
            packaging/aur/.gitignore
          updpkgsums: true
          commit_username: NickMarcha
          commit_email: 10127873+NickMarcha@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: macropad-bin ${{ env.TAG }}
